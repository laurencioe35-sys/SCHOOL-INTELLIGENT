services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_educativo
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-erp_dev_only}"
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_educativo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DATABASE_URL: "postgresql+psycopg://erp:${POSTGRES_PASSWORD:-erp_dev_only}@db:5432/erp_educativo"
      API_BASE_URL: http://localhost:8000
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      # React Strict Mode duplicates development effects; keep the local IP
      # ceiling aligned with the tenant ceiling to avoid false-positive 429s.
      RATE_LIMIT_PER_IP_PER_MINUTE: "${RATE_LIMIT_PER_IP_PER_MINUTE:-300}"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

  agent-worker:
    build:
      context: ./ai-agents-engine
    environment:
      ERP_REDIS_URL: redis://redis:6379/0
      AGENT_INPUT_STREAM: class:transcript:chunks
      AGENT_AUDIO_STREAM: class:audio:chunks
      AGENT_OUTPUT_STREAM: class:agent:results
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      # The worker may retrieve approved academic content from the internal ERP.
      # Use the Compose service hostname, never localhost from inside a container.
      ACADEMIC_MEMORY_API_URL: http://core-erp-backend:8200
      ACADEMIC_MEMORY_AGENT_SERVICE_KEY: "${ACADEMIC_MEMORY_AGENT_SERVICE_KEY:?ACADEMIC_MEMORY_AGENT_SERVICE_KEY must be set in .env}"
    depends_on:
      redis:
        condition: service_healthy
      core-erp-backend:
        condition: service_started

  core-erp-backend:
    build:
      context: ./core-erp-backend
    environment:
      ERP_DATABASE_URL: "postgresql+psycopg2://erp:${POSTGRES_PASSWORD:-erp_dev_only}@db:5432/erp_educativo"
      ERP_REDIS_URL: redis://redis:6379/0
      ERP_SECRET_KEY: "${ERP_SECRET_KEY:-dev-secret-change-in-production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      ACADEMIC_MEMORY_AGENT_SERVICE_KEY: "${ACADEMIC_MEMORY_AGENT_SERVICE_KEY:?ACADEMIC_MEMORY_AGENT_SERVICE_KEY must be set in .env}"
      CRDT_AUTHORIZATION_SERVICE_KEY: "${CRDT_AUTHORIZATION_SERVICE_KEY:?CRDT_AUTHORIZATION_SERVICE_KEY must be set in .env}"
    ports: ["8200:8200"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  multimedia-stream-server:
    build:
      context: ./multimedia-stream-server
    environment:
      CRDT_PORT: 4444
      ERP_REDIS_URL: redis://redis:6379/0
      ERP_SECRET_KEY: "${ERP_SECRET_KEY:-dev-secret-change-in-production}"
      CRDT_AUTHORIZATION_API_URL: http://core-erp-backend:8200
      CRDT_AUTHORIZATION_SERVICE_KEY: "${CRDT_AUTHORIZATION_SERVICE_KEY:?CRDT_AUTHORIZATION_SERVICE_KEY must be set in .env}"
    ports: ["4444:4444"]
    depends_on:
      redis:
        condition: service_healthy
      core-erp-backend:
        condition: service_started

volumes:
  postgres_data:
