# EJEMPLO/DEV SOLAMENTE. En producción usa 02-external-secrets.yaml (AWS
# Secrets Manager) o el equivalente de Vault — NUNCA comitear este
# archivo con valores reales a git. Útil solo para probar los manifiestos
# en un clúster local (kind/minikube) sin depender de un cloud provider.
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-educativo
type: Opaque
stringData:
  ERP_DATABASE_URL: "postgresql+psycopg2://postgres:CHANGE_ME@postgres-host:5432/erp_educativo"
  ERP_REDIS_URL: "redis://redis-host:6379/0"
  ERP_SECRET_KEY: "CHANGE_ME_run_scripts/generate_secrets.sh"
  AI_AGENTS_INTERNAL_KEY: "CHANGE_ME_run_scripts/generate_secrets.sh"
  ANTHROPIC_API_KEY: ""
  PAYMENT_GATEWAY_API_KEY: ""
