apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-educativo
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-external-secrets.yaml   # o 02b-secret.example.yaml para probar local sin AWS/Vault
  - 09-migrate-job.yaml
  - 10-core-erp-backend.yaml
  - 11-batch-worker.yaml
  - 12-crdt-sync-server.yaml
  - 20-ingress.yaml
images:
  - name: REGISTRY/erp-core-backend
    newName: your-registry.example.com/erp-core-backend
    newTag: "replace-with-real-tag"
  - name: REGISTRY/erp-crdt-sync-server
    newName: your-registry.example.com/erp-crdt-sync-server
    newTag: "replace-with-real-tag"
