# Sincroniza los secretos generados por scripts/generate_secrets.sh
# (publicados en AWS Secrets Manager con `--backend aws-secrets-manager`)
# hacia un Secret nativo de Kubernetes, usando External Secrets Operator
# (https://external-secrets.io — instalar con
# `helm install external-secrets external-secrets/external-secrets -n
# external-secrets --create-namespace` antes de aplicar esto).
#
# Alternativa con HashiCorp Vault: si tu backend es `vault` en vez de AWS,
# usa el Vault CSI Provider
# (https://developer.hashicorp.com/vault/docs/platform/k8s/csi) en su
# lugar — reemplaza este SecretStore/ExternalSecret por un
# SecretProviderClass apuntando a `secret/erp-educativo/prod` (el mismo
# --vault-path usado al generar los secretos).
#
# El Service Account de este clúster necesita permiso IAM para leer
# `erp-educativo/prod` en Secrets Manager (vía IRSA en EKS, o Workload
# Identity equivalente en GKE/AKS) — eso se configura fuera de este
# manifiesto, en la infraestructura del clúster.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: erp-educativo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # ajustar a la región real
      auth:
        jwt:
          serviceAccountRef:
            name: erp-backend-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-secrets
  namespace: erp-educativo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: erp-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Debe coincidir con --secret-name usado en generate_secrets.sh,
        # y además incluir ahí (a mano, una sola vez, vía `aws
        # secretsmanager put-secret-value` o la consola) las credenciales
        # que el script NO puede generar: ERP_DATABASE_URL (con el
        # endpoint real de RDS), PAYMENT_GATEWAY_API_KEY (Stripe),
        # ANTHROPIC_API_KEY, LIVEKIT_API_KEY/SECRET.
        key: erp-educativo/prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-backend-sa
  namespace: erp-educativo
  annotations:
    # EKS/IRSA: reemplazar por el ARN real del rol IAM con permiso
    # secretsmanager:GetSecretValue sobre erp-educativo/prod.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/erp-backend-secrets-reader"
